<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Extrator de Imóveis SP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      padding: 24px;
      background: #f5f7fa;
      color: #2d3748;
    }
    h1 { font-size: 18px; text-align: center; margin-bottom: 16px; color: #1a202c; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input {
      width: 100%; padding: 10px; border: 2px solid #e2e8f0;
      border-radius: 6px; font-size: 14px; margin-bottom: 4px;
    }
    input:focus { outline: none; border-color: #4299e1; }
    small { display: block; color: #718096; margin-bottom: 12px; font-size: 12px; }
    button {
      width: 100%; padding: 10px; background: #4299e1; color: white;
      border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #3182ce; }
  </style>
</head>
<body>
  <h1>Extrator de Imóveis SP</h1>
  <label for="endereco">Endereço Completo:</label>
  <input type="text" id="endereco" placeholder="Ex: Avenida Paulista, 1578" autocomplete="off">
  <small>Digite a rua e número em São Paulo/SP</small>
  <button id="buscar">Buscar Dados</button>
  <small style="text-align:center; margin-top:12px; margin-bottom:0;">Versão <span id="app-version">-</span></small>
  <script src="popup.js"></script>
</body>
</html>
